spring.application.name=colorblind-web

# Increase max file size for proxy responses
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Better HTTP client settings
jsoup.timeout=20000
jsoup.max-body-size=10485760

# Force modern TLS
jdk.tls.client.protocols=TLSv1.3



accesslens.render.pool-size=2
accesslens.render.headless=true
accesslens.render.max-samples=400
accesslens.render.navigation-timeout-ms=30000
accesslens.render.settle-delay-ms=1200
accesslens.render.viewport-width=1280
accesslens.render.viewport-height=900
accesslens.render.acquire-timeout-seconds=60

# Move the allow-list out of the controller so it is configuration, not code
accesslens.security.allowed-domains=books.toscrape.com,www.oatly.com,nymag.com